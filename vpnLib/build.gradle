apply plugin: 'com.android.library'
group = 'com.github.nizwar'

// Builds with the Android Gradle Plugin used by JitPack (7.3, see the root
// build.gradle) and with the AGP 8/9 of a Flutter app that includes this module
// from source (openvpn_flutter's example app does). Keep the DSL compatible
// with both: property assignments, no library versionCode/targetSdk.
android {
    namespace = 'de.blinkt.openvpn'
    compileSdk = 33

    defaultConfig {
        minSdk = 21
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.appcompat:appcompat:1.6.0'
}
